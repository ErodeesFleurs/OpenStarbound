name: Build
permissions:
  actions: read

on:
  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        description: Linux (xclang)
        default: false
      windows:
        type: boolean
        description: Windows (xclang MinGW)
        default: true
      macOS:
        type: boolean
        description: macOS (xclang)
        default: false
  push:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'cmake/**'
      - 'triplets/**'
      - 'ports/**'
      - 'scripts/ci/**'
      - '.github/workflows/build.yml'
    branches:
      - '*'
  pull_request:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'cmake/**'
      - 'triplets/**'
      - 'ports/**'
      - 'scripts/ci/**'
      - '.clang-format'
      - 'scripts/format-source.sh'
      - '.github/workflows/build.yml'
    branches:
      - '*'

jobs:
  build_windows:
    name: Build OpenStarbound Windows x64
    runs-on: windows-latest
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.windows == true)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      # Qt5's native MinGW build uses make; no MSYS2 compiler or C++ runtime is installed.
      - name: Install Qt5 make tool
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-make

      - name: Add Qt5 make to PATH
        shell: pwsh
        run: |
          "MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install xclang 23.1.2.9
        shell: pwsh
        run: cmake "-DXCLANG_INSTALL_DIR=$env:RUNNER_TEMP/xclang-23.1.2.9" -P scripts/ci/install-xclang.cmake

      - name: setup 7-Zip action
        uses: milliewalky/setup-7-zip@v2

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force "${{ github.workspace }}/.cache/vcpkg"

      - name: Run CMake
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'windows-release'
          buildPreset: 'windows-release'

      - name: Run Post-Build Task
        shell: cmd
        run: scripts\ci\windows\post_build.bat

      - name: Audit Windows imports and runtime
        run: cmake -P scripts/ci/windows/audit-runtime.cmake

      - name: Run Tests
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          testPreset: 'windows-release'

      - name: Assemble Files
        shell: cmd
        run: |
          scripts\ci\windows\assemble.bat
          ren client.zip OpenStarbound-Windows-Client.zip
          ren server.zip OpenStarbound-Windows-Server.zip

      - name: Prepare Artifacts
        shell: cmd
        run: |
          7z -bb3 -mtp=2 -mm=Deflate64 -mx=9 a dist.zip -r dist\
          ren dist.zip OpenStarbound-Windows-All-DevOnly.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-Windows-All-DevOnly
          path: OpenStarbound-Windows-All-DevOnly.zip
          archive: false

      - name: Upload Client
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-Windows-Client
          path: OpenStarbound-Windows-Client.zip
          archive: false

      - name: Upload Server
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-Windows-Server
          path: OpenStarbound-Windows-Server.zip
          archive: false

      - name: Install Inno Setup
        shell: cmd
        run: |
          set "ISCC_PATH=%programfiles%\Inno Setup 7\ISCC.exe"
          if exist "%ISCC_PATH%" exit /b 0
          curl -fL -o "%tmp%\innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
          if errorlevel 1 exit /b 1
          "%tmp%\innosetup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          if not exist "%ISCC_PATH%" exit /b 1

      - name: Create Installer
        shell: pwsh
        run: '& "C:\Program Files\Inno Setup 7\iscc.exe" /Oinstaller scripts\inno\setup.iss'

      - name: Upload Installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-Windows-Installer
          path: installer/OpenStarbound-Windows-Installer.exe
          archive: true
          compression-level: 0

  build_linux:
    name: Build OpenStarbound Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name != 'workflow_dispatch') || (inputs.linux == true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            preset: linux-release
            triplet: x64-linux
            artifact: OpenStarbound-Linux-xclang
          - arch: arm64
            runner: ubuntu-24.04-arm
            preset: linux-arm-release
            triplet: arm64-linux
            artifact: OpenStarbound-Linux-ARM-xclang
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Check changed C++ lines
        if: github.event_name == 'pull_request' && matrix.arch == 'x86_64'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 -m venv "$RUNNER_TEMP/source-quality"
          "$RUNNER_TEMP/source-quality/bin/pip" install 'clang-format==21.1.8'
          CLANG_FORMAT="$RUNNER_TEMP/source-quality/bin/clang-format" scripts/format-source.sh --check --base "$BASE_SHA"

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkgconf libxmu-dev libgl-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          '^libxcb.*-dev' libx11-xcb-dev libxrender-dev libxkbcommon-x11-dev \
          autoconf autoconf-archive automake libtool libltdl-dev patchelf tarlz

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - name: Install xclang 23.1.2.9
        run: cmake "-DXCLANG_INSTALL_DIR=$RUNNER_TEMP/xclang-23.1.2.9" -P scripts/ci/install-xclang.cmake
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg"

      - name: Run CMake
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: '${{ matrix.preset }}'
          buildPreset: '${{ matrix.preset }}'

      - name: Prepare jemalloc runtime
        run: scripts/ci/linux/prepare-jemalloc-runtime.sh build/${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}

      - name: Prepare Artifacts
        run: tarlz -c9vf ${{ matrix.artifact }}.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.lz
          archive: false

      - name: Run Tests
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          testPreset: '${{ matrix.preset }}'

      - name: Assemble Files
        run: |
          scripts/ci/linux/assemble.sh
          mv -v client.tar.lz ${{ matrix.artifact }}-Client.tar.lz
          mv -v server.tar.lz ${{ matrix.artifact }}-Server.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-Client
          path: ${{ matrix.artifact }}-Client.tar.lz
          archive: false

      - name: Upload Server Files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-Server
          path: ${{ matrix.artifact }}-Server.tar.lz
          archive: false

  build_macos:
    name: Build OpenStarbound macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.macOS == true)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            preset: macos-release
            lib_arch: x64
            artifact: OpenStarbound-macOS-Intel
          - arch: arm64
            runner: macos-15
            preset: macos-arm-release
            lib_arch: arm64
            artifact: OpenStarbound-macOS-Silicon
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: brew install autoconf automake libtool tarlz

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - name: Install xclang 23.1.2.9
        run: cmake "-DXCLANG_INSTALL_DIR=$RUNNER_TEMP/xclang-23.1.2.9" -P scripts/ci/install-xclang.cmake

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-xclang23.1.2.9-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg"

      - name: Run CMake
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: '${{ matrix.preset }}'
          buildPreset: '${{ matrix.preset }}'
          testPreset: '${{ matrix.preset }}'

      - name: Copy Libraries
        run: cp lib/osx/${{ matrix.lib_arch }}/*.dylib lib/osx/libsteam_api.dylib dist/

      - name: Prepare Artifacts
        run: tarlz -c9vf ${{ matrix.artifact }}.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.lz
          archive: false

      - name: Assemble Files
        run: |
          scripts/ci/macos/assemble.sh
          mv -v client.tar.lz ${{ matrix.artifact }}-Client.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-Client
          path: ${{ matrix.artifact }}-Client.tar.lz
          archive: false
