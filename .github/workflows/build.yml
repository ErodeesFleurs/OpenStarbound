        with:
          cmakeVersion: 3.29.0

      # LLVM 22 has no Intel macOS bottle or upstream X64 archive.
      - name: Setup LLVM
        id: llvm
        run: |
          archive="$RUNNER_TEMP/LLVM-20.1.7-macOS-X64.tar.xz"
          llvm_path="$RUNNER_TEMP/llvm-20.1.7"
          curl -fL --output "$archive" \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.7/LLVM-20.1.7-macOS-X64.tar.xz
          echo "ccf82ffe7e136ee49659cb57157856a7963d0950fac3d05aabba0db75bfba26f  $archive" | shasum -a 256 -c -
          mkdir -p "$llvm_path"
          # The full SDK expands to 6.7 GB; macOS runners have 14 GB of disk.
          tar -xJf "$archive" -C "$llvm_path" --strip-components=1 \
            LLVM-20.1.7-macOS-X64/bin/clang-20 \
            LLVM-20.1.7-macOS-X64/bin/clang \
            LLVM-20.1.7-macOS-X64/bin/clang++ \
            LLVM-20.1.7-macOS-X64/bin/clang-scan-deps \
            LLVM-20.1.7-macOS-X64/lib/clang
          rm "$archive"
          test -x "$llvm_path/bin/clang"
          test -x "$llvm_path/bin/clang++"
          test -x "$llvm_path/bin/clang-scan-deps"
          test -d "$llvm_path/lib/clang/20"
          echo "LLVM_PATH=$llvm_path" >> "$GITHUB_ENV"
          echo "$llvm_path/bin" >> "$GITHUB_PATH"
          echo "llvm-path=$llvm_path" >> "$GITHUB_OUTPUT"
          # Upstream Clang does not ask xcrun for the SDK; pass it to vcpkg and CMake.
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$sdkroot/usr/include/stdlib.h"
          echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"

      - name: Check module toolchain
        run: |
          "$LLVM_PATH/bin/clang++" --version
          "$LLVM_PATH/bin/clang-scan-deps" --version
          cmake --version
          ninja --version

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg"

      - name: Run CMake
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
          CC: ${{ steps.llvm.outputs.llvm-path }}/bin/clang
          CXX: ${{ steps.llvm.outputs.llvm-path }}/bin/clang++
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'macos-release'
          buildPreset: 'macos-release'
          testPreset: 'macos-release'

      - name: Copy Libraries
        working-directory: ${{ github.workspace }}
        run: |
          cp \
            lib/osx/x64/*.dylib \
            lib/osx/libsteam_api.dylib \
            dist/

      - name: Prepare Artifacts
        working-directory: ${{ github.workspace }}
        run: |
          tarlz -c9vf dist.tar.lz dist
          mv -v dist.tar.lz OpenStarbound-macOS-Intel.tar.lz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-macOS-Intel
          path: OpenStarbound-macOS-Intel.tar.lz
          archive: false

      - name: Assemble Files
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/macos/assemble.sh
          mv -v client.tar.lz OpenStarbound-macOS-Intel-Client.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-macOS-Intel-Client
          path: OpenStarbound-macOS-Intel-Client.tar.lz
          archive: false

  build-mac-arm:
    name: Build OpenStarbound macOS arm64
    runs-on: macos-15
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.macOS == true)) }}
    #if: ${{ (github.event_name == 'workflow_dispatch') && (inputs.macOS == true) }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 250M
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          brew install autoconf automake libtool tarlz

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.2

      - name: Setup LLVM
        id: llvm
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Check module toolchain
        run: |
          "$LLVM_PATH/bin/clang++" --version
          "$LLVM_PATH/bin/clang-scan-deps" --version
          cmake --version
          ninja --version

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg"

      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: '**/source/vcpkg.json'
          vcpkgConfigurationJsonGlob: '**/source/vcpkg-configuration.json'

      - name: Run CMake
        uses: lukka/run-cmake@v10
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
          CC: ${{ steps.llvm.outputs.llvm-path }}/bin/clang
          CXX: ${{ steps.llvm.outputs.llvm-path }}/bin/clang++
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/source/CMakeLists.txt'
          configurePreset: 'macos-arm-release'
          buildPreset: 'macos-arm-release'
          testPreset: 'macos-arm-release'

      - name: Copy Libraries
        working-directory: ${{ github.workspace }}
        run: |
          cp \
            lib/osx/arm64/*.dylib \
            lib/osx/libsteam_api.dylib \
            dist/

      - name: Prepare Artifacts
        working-directory: ${{ github.workspace }}
        run: |
          tarlz -c9vf dist.tar.lz dist
          mv -v dist.tar.lz OpenStarbound-macOS-Silicon.tar.lz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-macOS-Silicon
          path: OpenStarbound-macOS-Silicon.tar.lz
          archive: false

      - name: Assemble Files
        working-directory: ${{ github.workspace }}
        run: |
          scripts/ci/macos/assemble.sh
          mv -v client.tar.lz OpenStarbound-macOS-Silicon-Client.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenStarbound-macOS-Silicon-Client
          path: OpenStarbound-macOS-Silicon-Client.tar.lz
          archive: false
