name: Sanitizers

# AddressSanitizer + UndefinedBehaviorSanitizer build of the default package.
# Its check phase runs core_tests with UBSAN_OPTIONS=halt_on_error=1, so the
# first report fails the build; `nix run .#sanitized-tests` runs game_tests the
# same way against a local Starbound asset copy (not possible here, those assets
# are not redistributable).
#
# A sanitized build is ~30 minutes warm and rebuilds every dependency cold, so
# this is a nightly gate rather than something that runs on every push.  Run it
# on demand from the Actions tab, or locally with
#   nix build .#sanitized && nix run .#sanitized-tests

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  sanitized:
    name: ASan + UBSan (core_tests gate)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Optional: a binary cache turns the ~35 minute cold build into a few
      # minutes for the dependencies.
      # - uses: cachix/cachix-action@v15
      #   with:
      #     name: your-cache
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix build .#sanitized
        run: nix build .#sanitized --print-build-logs
